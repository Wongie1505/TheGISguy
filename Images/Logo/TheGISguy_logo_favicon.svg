<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Left curly brace -->
  <path d="M 30 50 Q 15 60, 15 80 Q 15 100, 25 100 Q 15 100, 15 120 Q 15 140, 30 150" 
        stroke="#22c55e" stroke-width="6" fill="none" stroke-linecap="round"/>
  
  <!-- Right curly brace -->
  <path d="M 170 50 Q 185 60, 185 80 Q 185 100, 175 100 Q 185 100, 185 120 Q 185 140, 170 150" 
        stroke="#22c55e" stroke-width="6" fill="none" stroke-linecap="round"/>
  
  <!-- Globe background circle -->
  <circle cx="100" cy="100" r="55" fill="#0f3a5f"/>
  
  <!-- Globe outer border -->
  <circle cx="100" cy="100" r="55" stroke="#22c55e" stroke-width="1.5" fill="none"/>
  
  <!-- Vertical grid lines -->
  <line x1="100" y1="45" x2="100" y2="155" stroke="#22c55e" stroke-width="1.2"/>
  <line x1="75" y1="55" x2="75" y2="145" stroke="#22c55e" stroke-width="1" opacity="0.8"/>
  <line x1="125" y1="55" x2="125" y2="145" stroke="#22c55e" stroke-width="1" opacity="0.8"/>
  
  <!-- Horizontal grid lines -->
  <line x1="45" y1="100" x2="155" y2="100" stroke="#22c55e" stroke-width="1.2"/>
  <line x1="55" y1="75" x2="145" y2="75" stroke="#22c55e" stroke-width="1" opacity="0.8"/>
  <line x1="55" y1="125" x2="145" y2="125" stroke="#22c55e" stroke-width="1" opacity="0.8"/>
  
  <!-- Curved latitude lines -->
  <ellipse cx="100" cy="100" rx="55" ry="25" stroke="#22c55e" stroke-width="1" fill="none" opacity="0.7"/>
  <ellipse cx="100" cy="100" rx="55" ry="40" stroke="#22c55e" stroke-width="1" fill="none" opacity="0.7"/>
  
  <!-- Location marker pin -->
  <g transform="translate(130, 70)">
    <!-- Pin drop shape -->
    <path d="M 0 -8 C -4.4 -8, -8 -4.4, -8 0 C -8 4 -4 8, 0 14 C 4 8, 8 4, 8 0 C 8 -4.4, 4.4 -8, 0 -8 Z" 
          fill="#eab308" stroke="#fef08a" stroke-width="0.5"/>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="3" fill="#fef08a"/>
  </g>
</svg>